spring:
  application:
    name: payment-mq-router
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: paymentTest
    password: paymentTest
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          fetch_size: 100
  threads:
    virtual:
      enabled: true
  jms:
    listener:
      session:
        transacted: true
      min-concurrency: 5
      max-concurrency: 10

ibm:
  mq:
    queue-manager: QM1
    channel: DEV.APP.SVRCONN
    conn-name: localhost(1414)
    user: app
    password: password

app:
  mq:
    queue: DEV.PAYMENT.IN
    dlq: DEV.PAYMENT.DLQ
    max-attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

server:
  port: 8081

logging:
  level:
    com.bank.payment: DEBUG